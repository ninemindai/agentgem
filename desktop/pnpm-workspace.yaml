# Marks desktop/ as its own pnpm workspace root. desktop/ is a standalone Electron
# app (its own electron/electron-builder toolchain + lockfile) and is deliberately
# NOT a member of the repo's root workspace. Without this file, `pnpm install` run
# here walks up to the repo's pnpm-workspace.yaml, treats desktop as a non-member,
# and silently skips its own deps — electron never installs. pnpm stops walking up
# at the first pnpm-workspace.yaml it finds, so this keeps the install self-contained.
packages: []

# --- pnpm 11 config (matches the root pnpm-workspace.yaml; desktop is a separate
# pnpm root so it needs its own copy). desktop-release CI pins pnpm 11.10.0. ---
# Cooldown disabled: a 24h window rejected the just-bumped vite@8.1.4 and broke the
# desktop-release build. Same call as root — see root pnpm-workspace.yaml.
minimumReleaseAge: 0
# Build scripts: esbuild ships a prebuilt binary, so its postinstall is unneeded.
# (electron 43 has no install script — electron-builder fetches the runtime itself
# via @electron/get — so the old `pnpm.onlyBuiltDependencies: ["electron"]`, which
# pnpm 11 no longer reads, was already vestigial and is dropped.)
# electron-winstaller arrived transitively with electron-builder 26.15.7, which now
# pulls electron-builder-squirrel-windows. Its `install` script (select-7z-arch.js)
# stages a 7za binary for the Squirrel installer — a target we do not build:
# electron-builder.yml pins `win.target: [nsis]`. false = don't run, but acknowledged.
# If a Squirrel/AppX target is ever added, flip this to true.
allowBuilds:
  electron-winstaller: false
  esbuild: false
verifyDepsBeforeRun: false
