<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Warm-dark tile, matching the console's #211d18 tone -->
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2621"/>
      <stop offset="1" stop-color="#171310"/>
    </linearGradient>
    <!-- Soft terracotta glow lifting the gem off the tile -->
    <radialGradient id="glow" cx="0.5" cy="0.46" r="0.55">
      <stop offset="0" stop-color="#c8543f" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#c8543f" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#c8543f" stop-opacity="0"/>
    </radialGradient>
    <!-- Contact shadow under the gem -->
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <!-- Top-edge sheen on the tile -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.14" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- macOS grid: rounded tile inset 100px, radius ~185 -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#sheen)"/>

  <!-- glow + contact shadow -->
  <ellipse cx="512" cy="500" rx="360" ry="360" fill="url(#glow)"/>
  <ellipse cx="512" cy="800" rx="230" ry="52" fill="url(#shadow)"/>

  <!-- Brand gem (favicon geometry) scaled into a centered 650px box -->
  <svg x="187" y="180" width="650" height="650" viewBox="0 0 40 40">
    <!-- pavilion (lower body) -->
    <path d="M4 14 L20 16 L20 38 Z" fill="#8b2e21"/>
    <path d="M36 14 L20 16 L20 38 Z" fill="#a8392a"/>
    <!-- crown (upper facets) -->
    <path d="M20 2 L4 14 L20 16 Z" fill="#7d2a1e"/>
    <path d="M20 2 L36 14 L20 16 Z" fill="#bb4a38"/>
    <!-- table band across the girdle -->
    <path d="M4 14 L36 14 L20 16 Z" fill="#c8543f"/>
    <!-- specular sliver on the bright crown facet -->
    <path d="M20 2 L36 14 L26.5 12.4 Z" fill="#e07a5f" fill-opacity="0.85"/>
    <!-- crisp outline to keep the silhouette sharp -->
    <path d="M20 2 L36 14 L20 38 L4 14 Z" fill="none" stroke="#5c1f16" stroke-width="0.5" stroke-linejoin="round"/>
  </svg>
</svg>
