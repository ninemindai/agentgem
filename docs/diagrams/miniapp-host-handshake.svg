<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 796" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0891b2" />
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669" />
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed" />
    </marker>
    <marker id="arrow-rose" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1000" height="796" fill="#ffffff"/>
  <rect x="0" y="0" width="1000" height="796" fill="url(#grid)"/>

  <text x="20" y="32" fill="#0f172a" font-size="18" font-weight="700">Miniapp ↔ host handshake — MCP Apps `ui/*` over postMessage</text>
  <text x="20" y="52" fill="#64748b" font-size="11">The sealed iframe carries the transport (the shim); meta.json carries the grant (needs). Neither file alone makes the app work.</text>

  <!-- ===== actors ===== -->
  <rect x="60" y="72" width="340" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="230" y="96" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">sealed iframe</text>
  <text x="230" y="114" fill="#64748b" font-size="10" text-anchor="middle">srcDoc · null origin · sandbox="allow-scripts"</text>
  <text x="230" y="132" fill="#0891b2" font-size="10" text-anchor="middle">index.html + mcpAppClient() shim</text>

  <rect x="600" y="72" width="340" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="770" y="96" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">trusted host</text>
  <text x="770" y="114" fill="#64748b" font-size="10" text-anchor="middle">console Runner · mcpUiHost router</text>
  <text x="770" y="132" fill="#7c3aed" font-size="10" text-anchor="middle">attaches iff meta.needs is non-empty</text>

  <!-- lifelines -->
  <line x1="230" y1="144" x2="230" y2="586" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="770" y1="144" x2="770" y2="586" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ===== 1. shim boots ===== -->
  <rect x="78" y="164" width="304" height="34" rx="6" fill="#ecfeff" stroke="#a5f3fc" stroke-width="1"/>
  <text x="230" y="179" fill="#0e7490" font-size="10" text-anchor="middle">shim runs FIRST in &lt;head&gt;, before the game script</text>
  <text x="230" y="192" fill="#0e7490" font-size="10" text-anchor="middle" font-weight="600">window.agentgemApp = api</text>

  <!-- ===== 2. ui/initialize ===== -->
  <text x="500" y="233" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">ui/initialize</text>
  <text x="500" y="247" fill="#64748b" font-size="9" text-anchor="middle">bounded retry ×5 / 800 ms — beats the host listener-attach race</text>
  <line x1="234" y1="256" x2="766" y2="256" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>

  <!-- ===== 3. initialize result ===== -->
  <text x="500" y="288" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">result { protocolVersion, tools, hostContext }</text>
  <text x="500" y="302" fill="#059669" font-size="9" text-anchor="middle">tools = HOST_TOOLS.filter(t =&gt; needs.includes(TOOL_CAP[t.name])) — advertise only declared caps</text>
  <line x1="766" y1="311" x2="234" y2="311" stroke="#059669" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>

  <!-- ===== 4. initialized ack ===== -->
  <text x="500" y="341" fill="#475569" font-size="11" text-anchor="middle">ui/notifications/initialized</text>
  <line x1="234" y1="350" x2="766" y2="350" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="500" y="366" fill="#94a3b8" font-size="9" text-anchor="middle">handshake complete — queued tools/call flush</text>

  <!-- ===== 5. tools/call ===== -->
  <text x="500" y="400" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">tools/call { name, arguments }</text>
  <text x="500" y="414" fill="#64748b" font-size="9" text-anchor="middle">name must be a LITERAL string — a dynamic name scans as nothing and gets pruned</text>
  <line x1="234" y1="423" x2="766" y2="423" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- consent gate on the host -->
  <rect x="640" y="435" width="260" height="34" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
  <text x="770" y="450" fill="#b45309" font-size="10" text-anchor="middle" font-weight="600">consent gate</text>
  <text x="770" y="463" fill="#b45309" font-size="9" text-anchor="middle">AUTO_CAPS bypass · gated caps prompt the viewer</text>

  <!-- ===== 6. result / denial ===== -->
  <text x="500" y="495" fill="#0f172a" font-size="11" font-weight="600" text-anchor="middle">result  |  error −32001 (consent denied)</text>
  <line x1="766" y1="504" x2="234" y2="504" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow-violet)"/>

  <!-- ===== 7. streaming notifications ===== -->
  <text x="500" y="534" fill="#475569" font-size="11" text-anchor="middle">ui/notifications/tool-result { toolName, chunk }</text>
  <text x="500" y="548" fill="#94a3b8" font-size="9" text-anchor="middle">streaming caps push each event; one-shot caps answer in the result above</text>
  <line x1="766" y1="557" x2="234" y2="557" stroke="#059669" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow-emerald)"/>

  <!-- ===== failure lane ===== -->
  <rect x="60" y="602" width="880" height="100" rx="8" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
  <text x="80" y="624" fill="#9f1239" font-size="12" font-weight="700">When the shim is missing (the silent failure)</text>
  <line x1="80" y1="636" x2="920" y2="636" stroke="#fecdd3" stroke-width="1"/>

  <text x="80" y="656" fill="#9f1239" font-size="10">no shim in &lt;head&gt;</text>
  <line x1="196" y1="652" x2="238" y2="652" stroke="#e11d48" stroke-width="1.2" marker-end="url(#arrow-rose)"/>
  <text x="248" y="656" fill="#9f1239" font-size="10">window.agentgemApp undefined</text>
  <line x1="480" y1="652" x2="522" y2="652" stroke="#e11d48" stroke-width="1.2" marker-end="url(#arrow-rose)"/>
  <text x="532" y="656" fill="#9f1239" font-size="10">ui/initialize never sent</text>
  <line x1="720" y1="652" x2="762" y2="652" stroke="#e11d48" stroke-width="1.2" marker-end="url(#arrow-rose)"/>
  <text x="772" y="656" fill="#9f1239" font-size="10">retries exhaust (~4 s)</text>

  <text x="80" y="674" fill="#9f1239" font-size="10">every callTool rejects "no host" · the app degrades to its baked &lt;script id="game-data"&gt;</text>
  <text x="80" y="690" fill="#9f1239" font-size="10">meanwhile meta.json still declared `needs`, so the host advertised tools to a frame that cannot speak — nothing errors, nothing logs</text>

  <!-- ===== source-of-truth footnote ===== -->
  <text x="20" y="732" fill="#0f172a" font-size="11" font-weight="700">Source of truth</text>
  <text x="20" y="750" fill="#64748b" font-size="10"><tspan fill="#0891b2" font-weight="600">index.html</tspan> — what the code USES (transport + literal tool names). The scan is total: gameGate seals every other channel, so the bridge is the only way out.</text>
  <text x="20" y="766" fill="#64748b" font-size="10"><tspan fill="#7c3aed" font-weight="600">meta.json</tspan> — what the host GRANTS (needs). Reconciled against the code at save: calling an undeclared tool throws; declaring an uncalled one prunes.</text>
  <text x="20" y="784" fill="#94a3b8" font-size="9">Both land in one MCP Apps resource: html → resource `text`, meta.json → `_meta["ai.agentgem/game"]`.  Spec: modelcontextprotocol/ext-apps (MVP 2026-01-26).</text>
</svg>
