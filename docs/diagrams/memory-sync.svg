<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace">
<!-- dark background so the exported .svg is self-contained on a light docs page -->
<rect x="0" y="0" width="1040" height="560" fill="#0b1221"/>
<defs>
  <marker id="arrowC" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/></marker>
  <marker id="arrowR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#fb7185"/></marker>
  <marker id="arrowS" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/></marker>
</defs>

<!-- ===== bridge container ===== -->
<rect x="288" y="150" width="464" height="342" rx="14" fill="rgba(167, 139, 250, 0.05)" stroke="#334155" stroke-width="1" stroke-dasharray="8,4"/>
<text x="300" y="142" fill="#a78bfa" font-size="12" font-weight="700">@agentgem/memory · two-way sync bridge</text>

<!-- lane labels -->
<text x="304" y="180" fill="#22d3ee" font-size="10" font-weight="600">① PULL — provider memories → recall index</text>
<text x="304" y="381" fill="#fb7185" font-size="10" font-weight="600">② PUSH — scrubbed, consent-gated candidates out</text>

<!-- ===== PULL lane arrows (left → right) ===== -->
<line x1="252" y1="278" x2="308" y2="222" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrowC)"/>
<line x1="490" y1="222" x2="548" y2="222" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrowC)"/>
<line x1="730" y1="222" x2="788" y2="278" stroke="#22d3ee" stroke-width="1.6" marker-end="url(#arrowC)"/>

<!-- ===== PUSH lane arrows (right → left) ===== -->
<line x1="788" y1="362" x2="732" y2="418" stroke="#fb7185" stroke-width="1.6" marker-end="url(#arrowR)"/>
<line x1="548" y1="424" x2="492" y2="424" stroke="#fb7185" stroke-width="1.6" marker-end="url(#arrowR)"/>
<line x1="308" y1="424" x2="252" y2="362" stroke="#fb7185" stroke-width="1.6" marker-end="url(#arrowR)"/>

<!-- ===== providers (external, left) ===== -->
<rect x="42" y="230" width="210" height="180" rx="8" fill="rgba(251, 191, 36, 0.08)" stroke="#fbbf24" stroke-width="1.5"/>
<text x="147" y="262" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">Memory providers</text>
<text x="147" y="282" fill="#94a3b8" font-size="9" text-anchor="middle">external · your API key</text>
<rect x="66" y="300" width="162" height="40" rx="6" fill="rgba(251, 191, 36, 0.10)" stroke="#fbbf24" stroke-width="1"/>
<text x="147" y="325" fill="#fef3c7" font-size="12" font-weight="600" text-anchor="middle">mem0</text>
<rect x="66" y="352" width="162" height="40" rx="6" fill="rgba(251, 191, 36, 0.10)" stroke="#fbbf24" stroke-width="1"/>
<text x="147" y="377" fill="#fef3c7" font-size="12" font-weight="600" text-anchor="middle">supermemory</text>

<!-- ===== recall (local, right) ===== -->
<rect x="788" y="230" width="210" height="180" rx="8" fill="rgba(34, 211, 238, 0.06)" stroke="#22d3ee" stroke-width="1.5"/>
<text x="893" y="262" fill="#a5f3fc" font-size="13" font-weight="700" text-anchor="middle">Local recall</text>
<text x="893" y="282" fill="#94a3b8" font-size="9" text-anchor="middle">on your machine only</text>
<rect x="812" y="300" width="162" height="40" rx="6" fill="rgba(34, 211, 238, 0.10)" stroke="#22d3ee" stroke-width="1"/>
<text x="893" y="319" fill="#e0f2fe" font-size="11" font-weight="600" text-anchor="middle">recall index</text>
<text x="893" y="333" fill="#94a3b8" font-size="8" text-anchor="middle">BM25/FTS5 · scrubbed turns</text>
<rect x="812" y="352" width="162" height="40" rx="6" fill="rgba(34, 211, 238, 0.10)" stroke="#22d3ee" stroke-width="1"/>
<text x="893" y="371" fill="#e0f2fe" font-size="11" font-weight="600" text-anchor="middle">proven-use outcomes</text>
<text x="893" y="385" fill="#94a3b8" font-size="8" text-anchor="middle">artifact-outcomes.db</text>

<!-- ===== PULL lane boxes ===== -->
<rect x="310" y="192" width="180" height="60" rx="6" fill="rgba(167, 139, 250, 0.10)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="400" y="216" fill="#ede9fe" font-size="11" font-weight="600" text-anchor="middle">pull (per-provider cursor)</text>
<text x="400" y="232" fill="#94a3b8" font-size="8" text-anchor="middle">paginated · incremental</text>
<rect x="550" y="192" width="180" height="60" rx="6" fill="rgba(52, 211, 153, 0.10)" stroke="#34d399" stroke-width="1.5"/>
<text x="640" y="216" fill="#d1fae5" font-size="11" font-weight="600" text-anchor="middle">normalize → upsert</text>
<text x="640" y="232" fill="#94a3b8" font-size="8" text-anchor="middle">into the recall index</text>

<!-- ===== PUSH lane boxes ===== -->
<rect x="550" y="394" width="180" height="66" rx="6" fill="rgba(167, 139, 250, 0.10)" stroke="#a78bfa" stroke-width="1.5"/>
<text x="640" y="418" fill="#ede9fe" font-size="11" font-weight="600" text-anchor="middle">build candidates</text>
<text x="640" y="433" fill="#94a3b8" font-size="8" text-anchor="middle">scrub (default-deny)</text>
<text x="640" y="447" fill="#94a3b8" font-size="8" text-anchor="middle">· dedupe by content-hash</text>
<rect x="310" y="394" width="180" height="66" rx="6" fill="rgba(251, 113, 133, 0.10)" stroke="#fb7185" stroke-width="1.5"/>
<text x="400" y="418" fill="#fecdd3" font-size="11" font-weight="600" text-anchor="middle">consent outbox</text>
<text x="400" y="433" fill="#94a3b8" font-size="8" text-anchor="middle">review · approve · push</text>
<text x="400" y="447" fill="#94a3b8" font-size="8" text-anchor="middle">per-candidate bookkeeping</text>

<!-- footer note -->
<text x="520" y="524" fill="#64748b" font-size="9" text-anchor="middle">Consent gate (rose) is the only path out — the outbox never pushes a candidate you haven't approved, and records each push so a retry can't double-write.</text>
</svg>
