name: CI

# Build + test on every push to main and every PR. `pnpm test` runs
# `tsc -b && vitest run` — tests execute against the compiled dist/, so the
# build is exercised as part of the test step.
#
# Node 24 runs on every push/PR; Node 26 is added only on release tags
# (v*, desktop-v*) — see the matrix below — to keep PR CI fast.
on:
  push:
    branches: [main]
    tags:
      - "v*" # core npm release
      - "desktop-v*" # desktop (Electron) release
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 24 on every push/PR; Node 26 added only on release tags (the
        # on.push.tags filter guarantees any refs/tags/* ref here is a release).
        # 24 stays the always-on gate, so 'test (24)' is the sole required check.
        node-version: ${{ startsWith(github.ref, 'refs/tags/') && fromJSON('[24, 26]') || fromJSON('[24]') }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # bubblewrap so the linux-bubblewrap sandbox boundary test actually runs here (it
      # self-skips if unprivileged user namespaces are unavailable). Relax the Ubuntu
      # 24.04 AppArmor restriction on unprivileged userns so bwrap can start.
      - run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Layout guard: this package builds and publishes from a fixed top-level
      # layout; a directory appearing at the root that isn't on this list is a
      # wiring mistake (or a stray tree that must not ship) — fail fast.
      - run: |
          unexpected=$(ls -d */ | grep -vE '^(desktop|dist|docs|mockups|node_modules|packages|scripts|skills|src|website)/$' || true)
          if [ -n "$unexpected" ]; then echo "unexpected top-level directories: $unexpected" >&2; exit 1; fi
      # Full build first (tsc -b && build-console) so consoleMount's server test
      # serves the real boot-splash HTML, not the "console not built"
      # placeholder. `pnpm test` alone only runs `tsc -b && vitest run` and never
      # invokes the esbuild console bundler — and that bundler needs the
      # tsc-compiled @agentgem/* dist to resolve, so order matters.
      - run: pnpm build
      - run: pnpm test
      # `pnpm test` is `tsc -b && vitest run` on the ROOT config, which only covers
      # dist/__tests__ — packages/console's 1150+ tests ran nowhere, in either repo. A
      # registry regression reached main that way (gemitPage leaking into the locked rail,
      # fixed in #563), caught days later by an unrelated downstream sync rather than here.
      #
      # Run via --filter so the package is the cwd: decrypt.test.ts resolves the server's
      # seal.ts through process.cwd(), so invoking vitest with --root from the repo root
      # silently fails to load it.
      - run: pnpm --filter @agentgem/console typecheck
      - run: pnpm --filter @agentgem/console test
      # Same gap, same fix: packages/insight has its own vitest config (src/**/*.test.ts)
      # and is not reachable from the root include either, so its 75+ tests ran nowhere.
      - run: pnpm --filter @agentgem/insight test
