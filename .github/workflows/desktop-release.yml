name: Desktop Release
on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

# Each OS builds its own installers (no publish), uploads them as artifacts; a
# final job attaches everything to the GitHub Release for the triggering tag.
# Publishing is decoupled from electron-builder because its default release tag
# is v{version} (e.g. v0.1.1) — which collides with the npm core's tag. We want
# the desktop-v* tag instead.
jobs:
  build:
    strategy:
      fail-fast: false # one platform failing must not cancel the others
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Only tag builds (desktop-v*) enter the 'release' environment, which holds the
    # signing + notarization secrets and is itself tag-restricted to desktop-v*. A
    # workflow_dispatch run resolves to no environment → no secrets → unsigned test
    # build, preserving the prior behavior.
    environment: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install
      - run: pnpm -C desktop install
      # Build installers only (no publish). On desktop-v* tags the 'release'
      # environment supplies these secrets, so the macOS app is signed with the
      # Developer ID cert (CSC_LINK) and notarized (mac.notarize is on in
      # electron-builder.yml). CSC_LINK is a macOS-only cert, so it is fed to the
      # mac runner only; Windows/Linux (and every off-tag dispatch build) get empty
      # values and stay unsigned. CSC_IDENTITY_AUTO_DISCOVERY must be off whenever
      # no cert is supplied, or electron-builder tries (and fails) to find one.
      - run: pnpm -C desktop dist
        env:
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
          if-no-files-found: ignore

  release:
    needs: build
    # Publish whatever built, even if a platform failed; only on a tag push.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          NOTES=$(cat <<'EOF'
          AgentGem desktop builds.

          **macOS** — signed with a Developer ID certificate and notarized by Apple,
          so Gatekeeper opens them normally. Drag AgentGem into Applications and launch.

          **Windows** — not yet code-signed. SmartScreen may warn: click
          *More info → Run anyway.*
          EOF
          )
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "AgentGem Desktop $TAG" \
              --notes "$NOTES"
          fi
