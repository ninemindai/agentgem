# Scheduled indexer for the marketplace "Popular Skills" home board.
# Runs `agentgem index-sources`, which walks each curated source's SKILL.md files +
# GitHub stars into the `curated_skills` table that GET /api/aggregator/popular-skills reads.
# Free on this public repo (GitHub Actions is unlimited for public repos).
#
# Requires ONE repository secret: DATABASE_URL = the same Neon connection string the
# deployed API uses (include ?sslmode=require). The built-in GITHUB_TOKEN (auto-provided,
# ~1000 req/hr) authenticates the GitHub reads so all 42 sources index without hitting the
# 60/hr unauthenticated limit — no personal token needed. Now that the indexer also fetches
# each skill's description (~934 calls/run), an optional repository secret INDEX_GITHUB_TOKEN
# (a PAT) lifts the rate limit to 5000/hr if the built-in token's headroom ever gets tight.
name: index-sources

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC (repos + star counts change slowly)
  workflow_dispatch: {}    # manual "Run workflow" button for an on-demand refresh

permissions:
  contents: read           # the job only READS this repo; it writes to Neon (external)

concurrency:
  group: index-sources
  cancel-in-progress: false

jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: pnpm/action-setup@b0f76dfb45f55f8421693e4803ac7bb65143bd34 # v6
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b   # compiles dist/cli.js + the workspace packages (no console/test build needed)
      - run: node dist/cli.js index-sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GITHUB_TOKEN: ${{ secrets.INDEX_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
