# Fly.io config for the agentgem API (api.agentgem.ai) — replaces the Render web
# service in render.yaml. Only the API moves: the agentgem-app static site STAYS on
# Render (free, CDN-served), and Neon Postgres is unchanged (same DATABASE_URL).
# Full cutover runbook: docs/deploy/fly-neon.md
#
# Machine: shared-cpu-1x / 512 MB, always-on (~$3.20/mo billed per second) — the
# whole point of leaving Render's free tier is escaping its 15-min-idle spin-down.
app = "agentgem-api"
primary_region = "iad"    # closest Fly region to Neon in aws-us-east-1 (the Render
                          # deploy sat in Oregon, paying cross-country DB latency)

kill_timeout = "30s"      # Fly's default 5s is too short for installGracefulShutdown's
                          # drain (pg pool + persistent transcript index close)

swap_size_mb = 512        # rare memory spike (large ingest, warm scan) degrades to
                          # slow instead of an OOM kill

[build]
  dockerfile = "Dockerfile"

[env]
  SERVE_CONSOLE = "false"             # API-only: the desktop console UI is a LOCAL app,
                                      # not served on api.agentgem.ai (same as Render)
  TRUST_PROXY = "1"                   # one hop: fly-proxy terminates TLS
  CLIENT_IP_HEADER = "cf-connecting-ip"  # api.agentgem.ai stays orange-clouded (proxied)
                                      # through OUR Cloudflare zone, same as the Render era,
                                      # so CF's real-client-IP header remains the rate-limit
                                      # key. If the record ever goes DNS-only (gray cloud,
                                      # direct to Fly), switch to fly-client-ip.
  AGENTGEM_REGISTRY_REPO = "ninemindai/agentgem-registry"
  AGENTGEM_PUBLIC_BASE = "https://api.agentgem.ai"
  AGENTGEM_SESSION_COOKIE_DOMAIN = ".agentgem.ai"
  AGENTGEM_WEB_ORIGINS = "https://app.agentgem.ai"
  # HOST=0.0.0.0 and PORT=4317 come from the Dockerfile.
  # Secrets (set via `fly secrets set`, never committed here) — the full live set,
  # NOT just render.yaml's two: the rest were added via the Render dashboard over
  # time (GitHub OAuth + session bridge + origin guard):
  #   DATABASE_URL                  — Neon connection string (include ?sslmode=require)
  #   AGGREGATOR_ADMIN_TOKEN        — gates POST /api/aggregator/keys
  #   AGENTGEM_SESSION_SECRET       — web session signing
  #   AGENTGEM_GITHUB_CLIENT_ID / AGENTGEM_GITHUB_CLIENT_SECRET — GitHub OAuth app
  #   AGENTGEM_TWITTER_CLIENT_ID / AGENTGEM_TWITTER_CLIENT_SECRET — X (Twitter) OAuth 2.0
  #       app (confidential client); callback https://api.agentgem.ai/api/auth/callback/twitter.
  #       "Sign in with X" activates only when BOTH are set (optional, like Google).
  #   ORIGIN_SHARED_SECRET          — origin guard shared secret
  #   GITHUB_TOKEN                  — registry publishing

[http_service]
  internal_port = 4317        # must match the Dockerfile's PORT — unlike Render, Fly
                              # does NOT inject a PORT env var
  force_https = true
  auto_stop_machines = "off"  # never auto-stop: always-on is the migration's purpose
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"         # unauthenticated liveness route (src/index.ts)
    interval = "30s"
    timeout = "3s"
    grace_period = "25s"      # mirrors the Dockerfile HEALTHCHECK start-period

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
